[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codi"
dynamic = ["version"]
dependencies = [
  "numpy>=1.23",
  "opencv-python>=4.8",
  "PyYAML>=6.0",
    "pydantic",
    "pynput",
    "pytest>=7.4",
    "setuptools",
]
[tool.setuptools.packages.find]
where = ["src"]
